# AI Dev OS v2 — frozen historical benchmark tasks.
#
# These are REAL Psyche OS tasks taken from accepted Git history. Ground truth
# (changed_sources / changed_tests / changed_other) comes verbatim from
# `git diff --name-only <base_sha> <result_sha>`.
#
# Freeze rule: this file is written BEFORE any benchmark tuning and is not
# adjusted after observing V1/V2 retrieval results. Search `terms` are the
# natural keys an implementer would use from the task description and are fixed
# here at definition time.
#
# Task classes: localized | cross-module | verification-heavy | docs

