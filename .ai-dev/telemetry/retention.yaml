# Telemetry retention — bounded, documented, no shadow database.

version: 1

jsonl:
  location: .ai-dev/telemetry/data/events.jsonl
  append_only: true
  max_bytes: 104857600          # 100 MiB soft cap; rotate + warn when exceeded

sqlite:
  location: .ai-dev/telemetry/data/derived.sqlite
  derived: true                  # always rebuildable from JSONL
  regenerate_on_start: true

retention:
  default_days: 90
  policy: prune_oldest_on_exceed

privacy:
  store_raw_prompts: false
  store_tool_outputs: false
  store_chain_of_thought: false
  redaction: required            # see redaction.yaml
