# Risk engine — deterministic classification.
# Determines: profile, initial model, verifier depth, review, human approval.
# HIGH/CRITICAL are reserved for a materially changed protected invariant/boundary.

version: 2

classification:
  primary_rule: >-
    Classify the delta: what changed, which invariant changed, and which trust
    boundary became enabled or materially different. A sensitive path or domain
    alone does not determine risk.
  conservative_unknowns: Material semantics that remain unknown escalate to the higher level.
  examples:
    historical_crypto_wording: low
    isolated_regression_test: low
    bounded_control_plane_bugfix: low_or_medium
    accepted_storage_ipc_filesystem_or_permission_model_use: low_or_medium
    ordinary_cross_module_product_behavior: medium
    material_storage_or_recovery_integrity_change: high
    material_permission_or_network_exposure_change: high
    irreversible_migration_or_crypto_key_lifecycle_change: critical

levels:
  low:
    triggers:
      - docs-only or status-only change with no semantic policy/design change
      - comment change
      - isolated new test (no production behavior change)
      - bounded validator/control-plane bugfix that preserves policy semantics
      - safe local edit
    default_profile: current_capable_agent
    initial_model: currently_selected_capable_coding_agent
    review: none
    human_approval: none

  medium:
    triggers:
      - multiple modules touched
      - API or contract change
      - dependency version change (non-production)
      - frontend/backend interaction
      - cross-module behavior change
    default_profile: balanced
    initial_model: currently_selected_capable_coding_agent
    review: risk_triggered
    human_approval: by_approval_matrix

  high:
    triggers:
      - material storage or recovery-integrity invariant change
      - material permissions or network-exposure change
      - material real privacy or trust-boundary change
      - material security-architecture change
    default_profile: quality
    initial_model: strong_or_different_model_when_explicitly_needed
    review: concrete_trigger_only
    human_approval: required_for_listed_actions

  critical:
    triggers:
      - crypto algorithm or key-lifecycle change
      - irreversible migration semantics
      - REAL_DATA_GATE or real-data admission change
    default_profile: quality
    initial_model: strong_or_different_model_when_explicitly_needed
    review: concrete_trigger_only
    human_approval: required_for_listed_actions

# Using accepted storage, IPC, filesystem, security, or permission mechanisms does
# not elevate risk alone. Human approval follows approvals.yaml actions, not labels.
# Ambiguous material semantics choose the higher level.
