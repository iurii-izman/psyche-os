# Provider mapping — explicit, versionable, documentation-sourced.
# This records a documented deterministic alias contract, NOT direct runtime proof.
# DeepSeek's Anthropic/Claude Code compatibility documentation maps Claude-style
# model names onto DeepSeek models. A harness-reported name such as
# `claude-opus-5[1m]` is therefore harness evidence only; it does not by itself
# prove which backend executed the request.
#
# Applicability rule (see scripts/ai_dev_v2.py `_mapping_context`): this mapping may
# yield MAPPED_BY_PROVIDER_CONTRACT ONLY when the active endpoint/upstream is itself
# supported by observable evidence (endpoint host identifies the provider, or an
# explicitly-parsed active upstream provider config names it). A key merely being
# present does NOT establish applicability.

version: 3

provider_mapping:
  deepseek:
    provider: deepseek
    compatibility_surface: anthropic-compatible
    # Provider-owned trusted endpoints. A mapping is applicable only when the active
    # endpoint/upstream host is in this list (or a trusted domain). `notdeepseek.com`
    # and `deepseek.example.com` are NOT trusted; the provider display name is not
    # trusted on its own.
    trusted_endpoints:
      - api.deepseek.com
    trusted_domains: []   # exact host only; no additional subdomains officially supported
    source:
      official_source_identifier: DeepSeek Anthropic/Claude Code compatibility documentation
      official_source_url: https://api-docs.deepseek.com/guides/anthropic_api
      retrieved: "2026-08-15"
      verified: "2026-08-15"
      scope_note: >
        Documents alias mapping only. Does NOT prove a specific local request used this
        backend; applicability must be established from endpoint/upstream evidence.
    aliases:
      - pattern: "claude-opus"
        maps_to: deepseek-v4-pro
      - pattern: "claude-sonnet"
        maps_to: deepseek-v4-flash
      - pattern: "claude-haiku"
        maps_to: deepseek-v4-flash
