# QUALITY — strong model earlier, stronger final verification, fresh review on a concrete trigger.
# Source: docs/AI_DEV_OS_V1.md §55. Not "enable every MCP/graph/memory".

version: 1
profile: quality

harness: claude-code

model:
  initial: strong           # for HIGH/CRITICAL; cheap recon allowed
  strategy: strong_implementation -> full_deterministic_gate -> fresh_reviewer_on_trigger

context:
  owner: rg + ast-grep
  graph: false
  memory: repository_only

verification:
  inner_loop: targeted
  final_gate: full_risk_gate
  extra: property_and_security_checks

review: fresh_reviewer_on_concrete_trigger
mcp: minimal_or_temporary
security: standard_policy_worktree_plus_sandbox_when_relevant
telemetry: full
