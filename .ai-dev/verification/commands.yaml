# Canonical verification commands — REAL project commands only.
# These are discovered from pyproject.toml, package.json, AGENTS.md, and scripts/.
# Do not invent generic commands. `uv run` resolves the project virtualenv.
# NOTE: ruff and mypy currently report PRE-EXISTING issues (see implementation report);
# they remain canonical commands, not newly-added failures.

version: 1

python:
  lint: uv run ruff check {paths}
  typecheck: uv run mypy src
  test_targeted: uv run pytest {paths} -q
  test_full: uv run pytest -q

diagnostics:
  optional_non_gating:
    - uv run mypy src

orchestration:
  delivery: uv run python scripts/dev/validate_orchestration.py
  research: uv run python scripts/validate_research_foundation.py

typescript:          # run from desktop/
  typecheck: npm run typecheck
  lint: npm run lint
  test_unit: npm run test:unit

rust:                # run from desktop/src-tauri/
  check: cargo check
  clippy: cargo clippy -- -D warnings
  test: cargo test

# CI remains deliberately broad. LOW/MEDIUM work uses targeted checks and one final
# gate: exact-SHA PR CI when it covers the changed stack, otherwise the appropriate
# local gate. Research and orchestration validators run only for their owners.
final_gate:
  exact_sha_pr_ci: preferred_when_relevant
  local_fallback:
    - uv run pytest -q
  owner_specific:
    control_plane: uv run python scripts/dev/validate_orchestration.py
    research_foundation: uv run python scripts/validate_research_foundation.py
