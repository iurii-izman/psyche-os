# Capability registry.
# States: DISABLED, LAB, CONDITIONAL, CORE, QUARANTINED.
# A capability is CORE only if justified by real work; being installed != CORE.
# Supply-chain lifecycle: DISCOVERED → PINNED → REVIEWED → LAB → CONDITIONAL/CORE.

version: 1

capabilities:
  # ---- Context primitives (CORE) ----
  ripgrep:
    state: core
    type: lexical-retrieval
    execution: local
    network: false
    filesystem: read
    always_on: false
    installed_as: user-local (winget)
    source: https://github.com/BurntSushi/ripgrep

  ast-grep:
    state: core
    type: structural-retrieval
    execution: local
    network: false
    filesystem: read
    always_on: false
    installed_as: user-local npm
    source: https://github.com/ast-grep/ast-grep

  # ---- Security (CONDITIONAL) ----
  gitleaks:
    state: conditional
    type: secret-scan
    execution: local
    network: false
    filesystem: read
    always_on: false

  osv-scanner:
    state: conditional
    type: dependency-vuln-scan
    execution: local
    network: true          # fetches OSV advisory DB
    filesystem: read
    always_on: false

  semgrep:
    state: conditional
    type: sast
    execution: local
    network: false
    filesystem: read
    always_on: false

  # ---- Harness / provider ----
  claude-code:
    state: core
    type: harness
    execution: local
    network: true          # provider calls
    always_on: true
    installed_as: user-local npm
    version: "2.1.233"
    wave3: retained
    wave3_note: Wave 3 harness tournament — no challenger passed BOTH frozen tasks; control retained (HARNESS_NO_WINNER).

  cc-switch:
    state: core
    type: config-profile-manager
    execution: local
    network: false
    always_on: false

  deepseek-provider:
    state: core
    type: provider
    execution: remote
    network: true
    always_on: false       # per-call

  # ---- Wave 1: Acceleration (syntax-aware diff) ----
  difftastic:
    state: conditional
    type: syntax-diff
    version: 0.70.0
    source: https://github.com/Wilfred/difftastic
    license: MIT
    execution: local
    network: false
    filesystem: read
    persistence: none
    always_on: false
    installed: true
    installed_as: user-local winget (Wilfred.difftastic)
    command: difft
    check: difft --version

  # ---- Wave 1: Acceleration (machine-readable pytest log + deterministic parser) ----
  # Plugin, not a standalone binary: used via `ai_dev_perf.py verify --reportlog`
  # (and `--report-log <path>` on any pytest run). Not directly invocable.
  pytest-reportlog:
    state: conditional
    type: test-reporting
    version: 1.0.0
    source: https://github.com/pytest-dev/pytest-reportlog
    license: MIT
    execution: local
    network: false
    filesystem: write       # writes the report-log JSONL artifact
    persistence: artifact-only
    always_on: false
    installed: true
    installed_as: dev dependency (uv, pinned ==1.0.0)
    command: null
    check: uv run python -c "import importlib.metadata as m; print(m.version('pytest-reportlog'))"

  reportlog-parser:
    state: conditional
    type: test-report-parser
    version: 0.1.0
    source: repository scripts/ai_dev_reportlog.py
    license: MIT
    execution: local
    network: false
    filesystem: read
    persistence: none
    always_on: false
    installed: true
    installed_as: repository script
    command: uv run python scripts/ai_dev_reportlog.py
    check: uv run python scripts/ai_dev_reportlog.py --version

  # ---- Wave 1: Acceleration (JIT launcher itself) ----
  capability-launcher:
    state: core
    type: jit-launcher
    version: 0.1.0
    source: repository scripts/ai_dev_capability.py
    license: MIT
    execution: local
    network: false
    filesystem: read-write  # writes bounded evidence under .ai-dev/evidence
    persistence: evidence-only
    always_on: false
    installed: true
    installed_as: repository script
    command: uv run python scripts/ai_dev_capability.py
    check: uv run python scripts/ai_dev_capability.py --version

  # ---- Tauri runtime (CONDITIONAL, NOT enabled) ----
  tauri-runtime-bridge:
    state: conditional
    type: runtime
    debug_only: true
    network: localhost
    enabled: false

  # ---- Intentionally deferred LAB candidates (NOT installed) ----
  # ---- Wave 2: Code intelligence tournament controls (existing PR11 infrastructure) ----
  v1:
    state: core
    type: code-intelligence-control
    version: null
    source: repository V1 workflow (rg + ast-grep; scripts/ai_dev_perf.py)
    license: MIT
    execution: local
    network: false
    filesystem: read
    always_on: false
    installed: true
    installed_as: repository V1 context broker
    command: null
    notes: rg + ast-grep lexical retrieval; tournament control baseline
  v2:
    state: core
    type: code-intelligence-control
    version: null
    source: repository PR11 lightweight local index (scripts/ai_dev_perf.py)
    license: MIT
    execution: local
    network: false
    filesystem: read
    always_on: false
    installed: true
    installed_as: repository code map / index (Wave 1 retained)
    command: null
    notes: deterministic symbol/module/test index; tournament control

  # ---- Wave 2: Code intelligence tournament (LAB; user-local installs) ----
  pathfinder:
    state: lab
    type: code-intelligence
    version: 0.23.2
    source: https://github.com/irahardianto/pathfinder
    license: MIT
    execution: local
    network: false
    filesystem: read
    persistence: index-on-disk (.pathfinder/ cache)
    always_on: false
    installed: true
    installed_as: user-local cargo (cargo install pathfinder-mcp; source build on Windows — no official Windows binary)
    command: pathfinder-mcp
    check: pathfinder-mcp --version
    notes: MCP server over stdio (driven via the tournament adapter's mini MCP client); tree-sitter fallback active without LSP
  symlens:
    state: lab
    type: code-intelligence
    version: 0.12.15
    source: https://github.com/TtTRz/symlens
    license: MIT
    execution: local-wsl
    network: false
    filesystem: read
    persistence: index-on-disk (~/.symlens/indexes in WSL)
    always_on: false
    installed: true
    installed_as: WSL2-local LAB tooling (rustup + cargo install symlens in Ubuntu-26.04)
    command: null
    check: wsl -d Ubuntu-26.04 -- bash -lc '. "$HOME/.cargo/env" && symlens --version'
    notes: Windows-incompatible crate (Unix daemon); runs via the symlens adapter copying the tree into WSL
  codebase-memory:
    state: lab
    type: code-intelligence
    version: 0.10.5
    source: https://github.com/DeusData/codebase-memory-mcp
    license: MIT
    execution: local
    network: false
    filesystem: read-write    # writes index cache under ~/.cache/codebase-memory-mcp/
    persistence: index-on-disk (SQLite graph cache)
    always_on: false
    installed: true
    installed_as: user-local uv tool (codebase-memory-mcp; native windows/amd64 binary, checksum verified)
    command: codebase-memory-mcp
    check: codebase-memory-mcp --version
    notes: CLI one-shot mode only (cli index_repository + search_graph); no daemon left running
  code-review-graph:
    state: lab
    type: code-intelligence
    version: 2.3.7
    source: https://github.com/tirth8205/code-review-graph
    license: MIT
    execution: local
    network: false
    filesystem: read-write    # writes local SQLite graph + .code-review-graph/ cache
    persistence: index-on-disk (SQLite graph)
    always_on: false
    installed: true
    installed_as: user-local uv tool (code-review-graph)
    command: code-review-graph
    check: code-review-graph --version
  aider-repo-map:
    state: lab
    type: code-intelligence
    version: 0.86.2
    source: https://github.com/Aider-AI/aider
    license: Apache-2.0
    execution: local
    network: false
    filesystem: read
    persistence: none (repo-map cache only)
    always_on: false
    installed: true
    installed_as: user-local uv tool (aider-chat)
    command: aider
    check: aider --version
    notes: Wave 2 uses ONLY the offline repo-map capability (--show-repo-map); no model requests through aider
  codesearch:
    state: lab
    type: code-intelligence
    installed: false

  # ---- Wave 2: Test selection tournament (dev-only pytest plugins) ----
  pytest-testmon:
    state: lab
    type: test-selection
    installed: false
    wave3: not-selected
    wave3_note: Wave 2 FALSE NEGATIVE on hub-schema DDL; removed from [dependency-groups].dev in Wave 3 (no longer required by the retained selector).
  pytest-impacted:
    state: lab
    type: test-selection
    installed: false
    wave3: not-selected
    wave3_note: effectively FULL on this repo; removed from [dependency-groups].dev in Wave 3 (no longer required by the retained selector).
  projectmem:
    state: lab
    type: memory
    installed: false
  reasonix:
    state: lab
    type: harness
    installed: true
    installed_as: user-local npm (prebuilt binary)
    version: "1.31.0"
    wave3: not-selected
    wave3_note: Wave 3 challenger (deepseek-v4-flash). PASSED Task B (E06, 38/38) but FAILED Task A (E07, 65/66) on the same interaction-reuse guard as the control; not eligible (needs both). Shadow-eligible.
  opencode:
    state: lab
    type: harness
    installed: true
    installed_as: user-local npm (native binary)
    version: "1.18.19"
    wave3: not-selected
    wave3_note: Wave 3 challenger (deepseek-v4-flash). FAILED both tasks (A 64/66, B 29/38). Not eligible.
  aider:
    state: lab
    type: harness
    installed: false
  codex-cli:
    state: lab
    type: harness
    installed: true
    installed_as: user-local npm
    version: "0.130.0"
    wave3: reference-only
    wave3_note: Wave 3 optional STRONG reference on Task B (gpt-5.5, ChatGPT auth). FAILED B (29/38); not part of the same-model winner calculation.
  rtk:
    state: lab
    type: compression
    installed: false
  context-mode:
    state: lab
    type: context
    installed: false
  nono:
    state: lab
    type: sandbox
    installed: false
