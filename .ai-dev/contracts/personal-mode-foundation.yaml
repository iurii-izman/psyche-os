task_id: personal-mode-foundation
base_sha: 44129765e05cb6f6c69c115a3718e09efc1a58e2

profile: quality
risk: critical

goal:
  - "Correct the accepted Field Preview product-truth defects and preserve a usable SYNTHETIC_LAB daily driver."
  - "Add fail-closed requested/effective runtime-profile enforcement below the renderer so a CLOSED LOCAL_PERSONAL request cannot open or write a Personal workspace, initialize AI, or inherit excluded capabilities."
  - "Close E11 evaluator/review-integrity gaps and prepare candidate-bound machine evidence and legitimate human-review intake without manufacturing human authority."
  - "Replace the attached orchestration prompt with an authority-grounded executable prompt whose blocked portions, freeze lifecycle, and human actions are unambiguous."

non_goals:
  - "No REAL_DATA_GATE OPEN decision, live owner attestation, fabricated human review, or real personal data."
  - "No production Personal write path while schema evolution, complete v9 portability, and crash-safe VMK rotation remain unapproved or unproved."
  - "No schema migration, destructive migration, new cryptographic algorithm, Argon2 parameter change, HKDF/AES design change, or parallel key hierarchy in this contract."
  - "No new production dependency, generic launcher framework, importer, assessment, professional handoff, attachment/blob write, Personal AI, or Personal longitudinal/N-of-1 workflow."
  - "No change to stable REAL_DATA_GATE policy/profile definitions merely to make a candidate pass."

