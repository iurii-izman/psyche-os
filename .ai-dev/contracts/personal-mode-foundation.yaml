acceptance:
  - "Network/cloud status reports inbound network, outbound provider, cloud storage, cloud disclosure, and telemetry orthogonally for configured/unconfigured SYNTHETIC_LAB and requested LOCAL_PERSONAL."
  - "The Windows launcher targets psyche-os-desktop.exe, handles a missing build actionably, loads .env.local only for SYNTHETIC_LAB, never prints the key, and uses the executable directory as its working directory."
  - "The native smoke uses the current Home marker; AI proposal transport and rendering preserve IDs, uncertainty, claim level, supporting evidence, counterevidence, unknowns, and questions without duplicate unknown uncertainty or persistence actions."
  - "Rust handlers, generated-command manifest, Tauri capability allowlist, and TypeScript API agree for every shipped command; nested selection casing and Unicode character limits agree end to end."
  - "All content-bearing reads, including reflection_exploration.get, require a valid unlocked session before data load; large sessions are bounded and an oversized response cannot terminate the sidecar."
  - "Reflection search excerpts are deterministic, Unicode-safe, bounded, and match-centered."
  - "Reflection key publication is exclusive/atomic enough that concurrent first starts cannot silently replace the only DPAPI-wrapped key."
  - "Export fails closed on unsupported or missing source columns, query/count mismatch, and query failure; it cannot report a verified empty export for a non-empty selected source."
  - "E11 never permits RDG-09 through RDG-12 to be NOT_APPLICABLE_EXCLUDED and cannot treat model output, a template, or an unbound review declaration as a completed required human review."
  - "E11 binds completed reviews to external schema-valid digest-verified records and enforces the exact enabled-boundary review matrix plus a mandatory substantive RDG-11 deployment review, while reporting human authorship/qualification as procedural rather than machine-proved."
  - "Requested LOCAL_PERSONAL with no valid OPEN evaluation reports NOT_ADMITTED, initializes no Personal store/provider/archive, accepts no content command, and never silently falls back to SYNTHETIC_LAB."
  - "OPENAI_API_KEY is omitted from the sidecar environment for LOCAL_PERSONAL/NOT_ADMITTED and Personal-excluded commands fail CAPABILITY_DISABLED before data load, persistence, provider construction, or network."
  - "Synthetic Lab behavior remains available and regression-tested; REAL_DATA_GATE and STATE remain CLOSED."
  - "The final prompt explicitly marks schema evolution and crash-safe key rotation as separate approval-gated architecture work and cannot claim READY_FOR_HUMAN_REVIEWS while either remains unproved."
  - "The final prompt distinguishes BASE_COMMIT, CANDIDATE_COMMIT, MERGE_COMMIT, and later evidence commits; build identity is raw-byte-bound to a clean detached MERGE_COMMIT and any product repair invalidates the lifecycle."

repository_required_gates:
  - "uv run pytest -q"
  - "uv run python scripts/dev/validate_orchestration.py"
  - "uv run python scripts/validate_research_foundation.py"
  - "npm --prefix desktop run typecheck"
  - "npm --prefix desktop run lint"
  - "npm --prefix desktop run test:unit"
  - "npm --prefix desktop run build"
  - "cargo check --manifest-path desktop/src-tauri/Cargo.toml"
  - "cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings"
  - "cargo test --manifest-path desktop/src-tauri/Cargo.toml"
  - "git diff --check"

contract_required_proof:
  - risk: "Profile bypass or mode confusion could admit sensitive content while the gate is closed."
    insufficiency_of_repository_gates: "Generic suites do not prove ordering before store/provider initialization."
    primary_oracle: "Focused Python/Rust tests with constructor, filesystem, command, environment, and transport sentinels for requested LOCAL_PERSONAL + CLOSED."
    failure_meaning: "A Personal trust-boundary bypass or an invalid test oracle; classify from the first failing assertion."
    alternate_oracles: []
    stop_or_escalation: "Keep Personal writes disabled and stop admission work until the failing boundary is proved."
  - risk: "RDG-10/RDG-11 or always-applicable controls could be laundered through exclusions or fabricated review declarations."
    insufficiency_of_repository_gates: "The accepted evaluator has a known positive-oracle gap."
    primary_oracle: "Focused E11 negative tests plus review-intake schema/path/digest/candidate/human-kind validation."
    failure_meaning: "The evaluator remains capable of authority laundering."
    alternate_oracles: []
    stop_or_escalation: "Do not seal or claim review readiness."
  - risk: "Provider credentials or Personal content could reach an excluded network path."
    insufficiency_of_repository_gates: "Renderer hiding does not prove Rust environment omission or provider non-construction."
    primary_oracle: "Rust/Python sentinel tests proving no API-key forwarding, provider construction, AI command, or transport invocation for LOCAL_PERSONAL/NOT_ADMITTED."
    failure_meaning: "RDG-07/provider exclusion is unproved."
    alternate_oracles: []
    stop_or_escalation: "Keep candidate invalid and Personal disabled."
  - risk: "A concurrent first start can orphan the encrypted Reflection database by replacing its wrapped key."
    insufficiency_of_repository_gates: "Existing persistence tests are single-process."
    primary_oracle: "Deterministic concurrent/exclusive-publication test that proves one durable key wins and both services reopen the same database or one fails closed."
    failure_meaning: "Reflection persistence remains vulnerable to unrecoverable first-start race."
    alternate_oracles: []
    stop_or_escalation: "Do not publish the daily-driver candidate."
  - risk: "An unauthenticated content read or an oversized session can disclose data or terminate the sidecar."
    insufficiency_of_repository_gates: "Existing happy-path UI tests do not cover locked exploration reads or frames above the transport maximum."
    primary_oracle: "Focused authorization and >64KiB integration tests proving pre-load rejection, bounded pagination, content-free oversize error, and a successful subsequent command."
    failure_meaning: "Desktop IPC confidentiality or availability remains broken."
    alternate_oracles: []
    stop_or_escalation: "Do not publish the daily-driver candidate."
  - risk: "The native packaged command ACL or export layer can disagree with source-level success paths."
    insufficiency_of_repository_gates: "Renderer mocks bypass native allowlists, and current export code swallows source query failures."
    primary_oracle: "Deterministic handler/build/capability/API parity check plus negative export fixtures for missing columns, failed query, and non-empty-to-empty output."
    failure_meaning: "Packaged product is unusable or reports false portability success."
    alternate_oracles: []
    stop_or_escalation: "Do not publish or claim portability readiness."

supplemental_evidence:
  - "Native UIA smoke using the durable current Home marker; a classified environment/oracle failure does not prove product failure when all load-bearing profile, IPC, and renderer tests pass."
  - "Windows packaged launch smoke with synthetic fixtures and no production secret."

proof_recovery_budget:
  max_feature_local_repair_loops: 1

oracle_failure_policy:
  classify_as: "product_defect|test_defect|oracle_defect|environment_defect|tool_harness_defect"
  low_medium: "Not applicable: overall task risk is CRITICAL."
  high_critical: "Missing load-bearing runtime, storage, security, or human-authority proof remains blocking; no post-failure relabelling."

stop_conditions:
  - "Personal writes require schema evolution, canonical-adjacent persistence design, or crash-safe VMK rotation not explicitly approved in this contract."
  - "A material conflict with Constitution, stable gate/profile, or accepted ADR requires architecture deviation/control-plane review."
  - "A profile-excluded boundary is shipped/reachable or cannot be proved unreachable."
  - "Any durable sensitive byte lacks explicit encryption, recovery, backup, restore, deletion, export, or plaintext-leak coverage."
  - "A deterministic required gate fails twice for the same product reason, or required human review is unavailable/unresolved."
  - "Candidate source/build changes after evidence freeze or sealing."
  - "The current synthetic-fixture E11 decision is asked to authorize REAL_PERSONAL without an accepted admission-semantics revision."
  - "Tracked dirty or out-of-scope changes appear, main moves after freeze, candidate/merge product trees differ, or a binary identity is text-normalized instead of raw-byte hashed."
  - "A required review schema cannot express the exact matrix/provenance, or human authorship/qualification is presented as machine-proved."
  - "Any required gate fails, an unresolved Critical/High remains, or a post-merge regression is found."

permissions:
  network: true
  dependencies: false
  migrations: false
  destructive: false

routing:
  initial: strong
  max_grounded_retry: 1
  escalation: strong

assumptions:
  - "The pasted owner authorization covers branch/commit/push/PR/merge only after independent product acceptance; publication is not evidence of real-data admission."
  - "SYNTHETIC_LAB remains the only writable production profile in this contract."
  - "A fictional injected OPEN decision may be used only in tests; no live attestation or real data will be created."
  - "A test-only admission injection is structurally unavailable to production startup and is not an E11 or owner decision."
  - "The untracked docs/development/proposals and docs/sources trees are user-owned and remain untouched."
