sources:
  - id: "CLIN-001"
    title: "Rediscovering psychopathology: the epistemology and phenomenology of the psychiatric object"
    authors_or_organization: "Parnas J.; Sass L. A.; Zahavi D."
    type: "peer-reviewed conceptual review"
    publication: "Schizophrenia Bulletin 39(2):270-277"
    publication_date: "2013-03-01"
    url: "https://doi.org/10.1093/schbul/sbs153"
    accessed_at: "2026-08-10"
    evidence_tier: "T3_framework_or_consensus"
    domains:
      - "psychiatric_phenomenology"
      - "clinical_ontology"
      - "provenance"
    project_implications:
      - "Preserve verbatim report separately from normalized phenomenology and interpretation."
      - "Model form, content, context, course, distress and relation to experience as distinct fields."
    limitations:
      - "Conceptual and clinically oriented rather than a validation study."
      - "Emphasis on psychosis phenomenology limits direct generalization to every domain."
    rights_notes: "Publisher copyright applies; cite and link, do not reproduce article text beyond licensed quotation limits."
    superseded: false
    review_due: "2030-08-10"

  - id: "CLIN-002"
    title: "Clinical descriptions and diagnostic requirements for ICD-11 mental, behavioural and neurodevelopmental disorders (CDDR)"
    authors_or_organization: "World Health Organization"
    type: "official international diagnostic reference"
    publication: "World Health Organization; ISBN 978-92-4-007726-3"
    publication_date: "2024-03-08"
    url: "https://www.who.int/publications/i/item/9789240077263"
    accessed_at: "2026-08-10"
    evidence_tier: "T1_official_classification_or_guideline"
    domains:
      - "ICD-11"
      - "psychiatric_classification"
      - "PTSD_CPTSD_grief_dissociation"
      - "neurodevelopment"
      - "substance_and_behavioral_disorders"
    project_implications:
      - "Use ICD-11 as a versioned clinical terminology reference, not as an autonomous diagnostic algorithm."
      - "Keep classification mappings separate from phenomena, functioning and research dimensions."
      - "Record system, release, code or URI, mapping source, date, status and uncertainty."
    limitations:
      - "Designed for trained health professionals and clinical judgement."
      - "Classification requirements do not establish a single etiology or individual causal explanation."
    rights_notes: "WHO publication is licensed CC BY-NC-ND 3.0 IGO; no adaptation or translation without permission and no embedded diagnostic text without rights review."
    superseded: false
    review_due: "2027-02-01"

  - id: "CLIN-003"
    title: "The ICD-11 developmental field study of reliability of diagnoses of high-burden mental disorders: results among adult patients in mental health settings of 13 countries"
    authors_or_organization: "Reed G. M. et al."
    type: "multinational diagnostic field study"
    publication: "World Psychiatry 17(2):174-186"
    publication_date: "2018-06-01"
    url: "https://doi.org/10.1002/wps.20524"
    accessed_at: "2026-08-10"
    evidence_tier: "T4_strong_primary_or_field_evidence"
    domains:
      - "ICD-11"
      - "diagnostic_reliability"
      - "psychiatric_classification"
    project_implications:
      - "Represent diagnostic mappings with category-specific uncertainty rather than a uniform confidence flag."
      - "Preserve supporting and contradicting evidence even when a documented classification exists."
    limitations:
      - "Covers selected high-burden disorders and participating clinical centres."
      - "Joint-rater reliability does not establish validity, etiology or ordinary test-retest performance."
    rights_notes: "Open-access article under the licence stated by the journal; retain citation and verify licence before reuse of tables or figures."
    superseded: false
    review_due: "2030-08-10"

  - id: "CLIN-004"
    title: "Scientific validation of the ICD-11 CDDR"
    authors_or_organization: "Maj M."
    type: "peer-reviewed validation commentary and synthesis"
    publication: "World Psychiatry 23(3):358-359"
    publication_date: "2024-10-01"
    url: "https://pubmed.ncbi.nlm.nih.gov/39279399/"
    accessed_at: "2026-08-10"
    evidence_tier: "T3_framework_or_consensus"
    domains:
      - "ICD-11"
      - "diagnostic_validation"
      - "PTSD_CPTSD_grief"
    project_implications:
      - "Treat CDDR as a scientifically developed clinical reference while retaining professional-scope boundaries."
      - "Use system-specific and versioned records for newer categories such as CPTSD and prolonged grief disorder."
    limitations:
      - "Short expert synthesis rather than an independent systematic review."
      - "Validation of a classification does not authorize consumer self-diagnosis or algorithmic diagnosis."
    rights_notes: "Article reuse is governed by the journal licence; cite and link, and verify terms before reproducing content."
    superseded: false
    review_due: "2028-08-10"

  - id: "CLIN-005"
    title: "DSM-5-TR and official updates to DSM-5-TR criteria and text through September 2025"
    authors_or_organization: "American Psychiatric Association"
    type: "official proprietary diagnostic reference and update log"
    publication: "Diagnostic and Statistical Manual of Mental Disorders, Fifth Edition, Text Revision"
    publication_date: "2025-09-01"
    url: "https://www.psychiatry.org/psychiatrists/practice/dsm/updates-to-dsm/updates-to-dsm-5-tr-criteria-text"
    accessed_at: "2026-08-10"
    evidence_tier: "T1_official_classification_or_guideline"
    domains:
      - "DSM-5-TR"
      - "psychiatric_classification"
      - "versioning"
      - "rights"
    project_implications:
      - "Use DSM-5-TR as a secondary, versioned crosswalk for US records and research comparability."
      - "Store edition and update date; never treat an edition as timeless."
      - "Do not embed criteria, manuals or proprietary assessment items without a licence."
    limitations:
      - "Proprietary clinical classification, not a standalone evidence synthesis for every category."
      - "Crosswalks with ICD are not lossless and may change with updates."
    rights_notes: "DSM-5-TR is copyrighted and proprietary to the American Psychiatric Association; citation and linking only unless explicit permission or licence is obtained."
    superseded: false
    review_due: "2027-02-01"

  - id: "CLIN-006"
    title: "About Research Domain Criteria (RDoC)"
    authors_or_organization: "National Institute of Mental Health"
    type: "official live research framework"
    publication: "NIMH Research Domain Criteria"
    publication_date: "n.d. (live framework snapshot)"
    url: "https://www.nimh.nih.gov/research/research-funded-by-nimh/rdoc/about-rdoc"
    accessed_at: "2026-08-10"
    evidence_tier: "T1_official_classification_or_guideline"
    domains:
      - "RDoC"
      - "transdiagnostic_research"
      - "development_and_environment"
    project_implications:
      - "Allow RDoC only as a versioned research lens, never a diagnosis or replacement for ICD or DSM."
      - "Do not represent self-report as evidence at neural-circuit, physiology or genetic units of analysis."
    limitations:
      - "Dynamic heuristic framework whose matrix and constructs can change."
      - "Does not provide a validated personal score or clinical decision rule."
    rights_notes: "US government web content is generally reusable subject to page-specific notices; cite the snapshot and verify third-party material."
    superseded: false
    review_due: "2027-02-01"

  - id: "CLIN-007"
    title: "The Hierarchical Taxonomy of Psychopathology (HiTOP): A Quantitative Nosology Based on Consensus of Evidence"
    authors_or_organization: "Kotov R. et al.; HiTOP Consortium"
    type: "peer-reviewed consensus review"
    publication: "Annual Review of Clinical Psychology 17:83-108"
    publication_date: "2021-05-07"
    url: "https://doi.org/10.1146/annurev-clinpsy-081219-093304"
    accessed_at: "2026-08-10"
    evidence_tier: "T3_framework_or_consensus"
    domains:
      - "HiTOP"
      - "dimensional_psychopathology"
      - "comorbidity"
      - "heterogeneity"
    project_implications:
      - "Use HiTOP as an optional versioned research mapping from narrow phenomena to dimensions and spectra."
      - "Retain source indicators and hierarchy level rather than only an aggregate label."
    limitations:
      - "Consensus taxonomy remains incomplete and is being revised."
      - "Evidence for structure does not by itself prove causal mechanisms or treatment utility."
    rights_notes: "Publisher copyright applies; cite DOI and do not reproduce protected tables or text without permission."
    superseded: false
    review_due: "2028-08-10"

  - id: "CLIN-008"
    title: "Meta-analysis of structural evidence for the Hierarchical Taxonomy of Psychopathology (HiTOP) model"
    authors_or_organization: "Ringwald W. R.; Forbes M. K.; Wright A. G. C."
    type: "meta-analysis"
    publication: "Psychological Medicine 53(2):533-546"
    publication_date: "2021-06-15"
    url: "https://doi.org/10.1017/S0033291721001902"
    accessed_at: "2026-08-10"
    evidence_tier: "T2_systematic_review_or_meta_analysis"
    domains:
      - "HiTOP"
      - "structural_validity"
      - "dimensional_psychopathology"
    project_implications:
      - "Treat spectra as optional aggregate views and keep the underlying indicators and model version."
      - "Do not infer causality or clinical utility from structural fit."
    limitations:
      - "Meta-analysis used 23 DSM diagnoses rather than the complete set of narrow signs and symptoms."
      - "Some forms of psychopathology were underrepresented."
    rights_notes: "Publisher copyright applies; bibliographic use and linking are permitted, while reuse of article content requires licence review."
    superseded: false
    review_due: "2028-08-10"

  - id: "CLIN-009"
    title: "The p Factor: One General Psychopathology Factor in the Structure of Psychiatric Disorders?"
    authors_or_organization: "Caspi A. et al."
    type: "longitudinal cohort study"
    publication: "Clinical Psychological Science 2(2):119-137"
    publication_date: "2014-03-01"
    url: "https://doi.org/10.1177/2167702613497473"
    accessed_at: "2026-08-10"
    evidence_tier: "T4_strong_primary_or_field_evidence"
    domains:
      - "p_factor"
      - "psychopathology_covariance"
      - "longitudinal_research"
    project_implications:
      - "At most treat a p-factor as a research-only summary tied to a specified model and indicator set."
      - "Never expose it as a diagnosis, cause, essence or global personal mental-health score."
    limitations:
      - "Findings depend on one cohort, selected indicators and factor specification."
      - "A latent factor is not automatically a biological or causal entity."
    rights_notes: "Publisher copyright applies; cite DOI, with no reproduction of protected text, tables or figures."
    superseded: false
    review_due: "2029-08-10"

  - id: "CLIN-010"
    title: "A critical evaluation of the p-factor literature"
    authors_or_organization: "Watts A. L.; Greene A. L.; Bonifay W.; Fried E. I."
    type: "critical peer-reviewed review"
    publication: "Nature Reviews Psychology 3:108-122"
    publication_date: "2023-12-22"
    url: "https://doi.org/10.1038/s44159-023-00260-2"
    accessed_at: "2026-08-10"
    evidence_tier: "T3_framework_or_consensus"
    domains:
      - "p_factor"
      - "latent_variable_validity"
      - "science_theatre_risk"
    project_implications:
      - "Reject the p-factor as root ontology, causal entity, personal score or explanation of a specific phenomenon."
      - "If used in research, store formula, indicators, calibration population, alternatives and model uncertainty."
    limitations:
      - "Critical perspective rather than a quantitative meta-analysis."
      - "Does not imply that all hierarchical or general-factor analyses are useless."
    rights_notes: "Springer Nature copyright applies; cite and link and do not reproduce protected content."
    superseded: false
    review_due: "2028-08-10"

  - id: "CLIN-011"
    title: "Empirical, theoretical, and practical advantages of the HEXACO model of personality structure"
    authors_or_organization: "Ashton M. C.; Lee K."
    type: "peer-reviewed theoretical and empirical review"
    publication: "Personality and Social Psychology Review 11(2):150-166"
    publication_date: "2007-05-01"
    url: "https://doi.org/10.1177/1088868306294907"
    accessed_at: "2026-08-10"
    evidence_tier: "T3_framework_or_consensus"
    domains:
      - "HEXACO"
      - "personality_structure"
      - "trait_crosswalk"
    project_implications:
      - "Preserve HEXACO as a source-native alternative model."
      - "Treat Big Five to HEXACO conversion as lossy and never reduce Honesty-Humility to a renamed Big Five domain."
    limitations:
      - "Authored by principal model developers and not evidence that HEXACO is a final universal ontology."
      - "Instrument, language and population remain relevant."
    rights_notes: "Publisher copyright applies; cite DOI and verify any instrument-specific permissions separately."
    superseded: false
    review_due: "2029-08-10"

  - id: "CLIN-012"
    title: "Personality traits across cultures"
    authors_or_organization: "Church A. T."
    type: "cross-cultural review"
    publication: "Current Opinion in Psychology 8:22-30"
    publication_date: "2016-04-01"
    url: "https://doi.org/10.1016/j.copsyc.2015.09.014"
    accessed_at: "2026-08-10"
    evidence_tier: "T3_framework_or_consensus"
    domains:
      - "Big_Five"
      - "cross_cultural_validity"
      - "measurement_invariance"
    project_implications:
      - "Require language, culture, measure version, calibration sample and invariance evidence for trait interpretation."
      - "Do not apply universal percentile labels or assume translated scales are automatically equivalent."
    limitations:
      - "Review predates some recent global datasets and many populations remain underrepresented."
      - "Factor replication does not mean cultural identity is exhausted by the trait model."
    rights_notes: "Elsevier copyright applies; cite and link, with no reuse of protected content without permission."
    superseded: false
    review_due: "2028-08-10"

  - id: "CLIN-013"
    title: "Toward a structure- and process-integrated view of personality: Traits as density distributions of states"
    authors_or_organization: "Fleeson W."
    type: "experience-sampling primary research"
    publication: "Journal of Personality and Social Psychology 80(6):1011-1027"
    publication_date: "2001-06-01"
    url: "https://doi.org/10.1037/0022-3514.80.6.1011"
    accessed_at: "2026-08-10"
    evidence_tier: "T4_strong_primary_or_field_evidence"
    domains:
      - "state_trait_distinction"
      - "personality"
      - "experience_sampling"
    project_implications:
      - "Store momentary states and context separately from longitudinal trait estimates."
      - "Require repeated observations and an explicit aggregation window before deriving a trait hypothesis."
    limitations:
      - "Short sampling windows and self-report-heavy studies."
      - "Does not validate inference of traits from arbitrary digital traces."
    rights_notes: "APA publisher copyright applies; cite DOI and do not reproduce protected content."
    superseded: false
    review_due: "2029-08-10"

  - id: "CLIN-014"
    title: "Personality stability and change: A meta-analysis of longitudinal studies"
    authors_or_organization: "Bleidorn W. et al."
    type: "meta-analysis of longitudinal studies"
    publication: "Psychological Bulletin 148(7-8):588-619"
    publication_date: "2022-07-01"
    url: "https://doi.org/10.1037/bul0000365"
    accessed_at: "2026-08-10"
    evidence_tier: "T2_systematic_review_or_meta_analysis"
    domains:
      - "Big_Five"
      - "lifespan_trait_change"
      - "longitudinal_measurement"
    project_implications:
      - "Give every trait estimate a validity interval, age, instrument, respondent and uncertainty."
      - "Model stability and change together; never present a personality profile as lifelong and immutable."
    limitations:
      - "Heterogeneity in measures, intervals, cohorts and facets."
      - "Observed score change can include measurement and response-shift effects."
    rights_notes: "APA publisher copyright applies; citation and linking only unless reuse is licensed."
    superseded: false
    review_due: "2028-08-10"

  - id: "CLIN-015"
    title: "Individual differences in personality trait changes across the lifespan: A meta-analysis of longitudinal studies"
    authors_or_organization: "Haehner P.; Hopwood C. J.; Schellenberg L.; Schwaba T.; Bleidorn W."
    type: "meta-analysis of longitudinal studies"
    publication: "Psychological Bulletin 152(4):420-447"
    publication_date: "2026-04-01"
    url: "https://pubmed.ncbi.nlm.nih.gov/42423713/"
    accessed_at: "2026-08-10"
    evidence_tier: "T2_systematic_review_or_meta_analysis"
    domains:
      - "personality"
      - "individual_differences_in_change"
      - "lifespan"
    project_implications:
      - "Represent uncertainty and individual heterogeneity in change rather than imposing a normative trajectory."
      - "Interpret longer-interval and facet-level change with instrument-aware uncertainty."
    limitations:
      - "Meta-analytic estimates inherit heterogeneity and selective availability of longitudinal datasets."
      - "The analysis does not identify the cause of an individual's score change."
    rights_notes: "APA publisher copyright applies; PubMed metadata may be cited, while article content requires publisher permission."
    superseded: false
    review_due: "2029-08-10"

  - id: "CLIN-016"
    title: "Theoretical propositions of life-span developmental psychology: On the dynamics between growth and decline"
    authors_or_organization: "Baltes P. B."
    type: "foundational lifespan-development theory"
    publication: "Developmental Psychology 23(5):611-626"
    publication_date: "1987-09-01"
    url: "https://doi.org/10.1037/0012-1649.23.5.611"
    accessed_at: "2026-08-10"
    evidence_tier: "T3_framework_or_consensus"
    domains:
      - "lifespan_development"
      - "plasticity"
      - "context_and_cohort"
    project_implications:
      - "Treat age periods as navigation context, not rigid normative stages."
      - "Record domain-specific gains, losses, historical context and cohort."
    limitations:
      - "Foundational metatheory, not an individual prediction model."
      - "Specific propositions require contemporary domain-specific evidence."
    rights_notes: "APA publisher copyright applies; cite DOI and do not reproduce protected article content."
    superseded: false
    review_due: "2031-08-10"

  - id: "CLIN-017"
    title: "Equifinality and multifinality in developmental psychopathology"
    authors_or_organization: "Cicchetti D.; Rogosch F. A."
    type: "foundational conceptual paper"
    publication: "Development and Psychopathology 8(4):597-600"
    publication_date: "1996-12-01"
    url: "https://doi.org/10.1017/S0954579400007318"
    accessed_at: "2026-08-10"
    evidence_tier: "T3_framework_or_consensus"
    domains:
      - "developmental_psychopathology"
      - "equifinality"
      - "multifinality"
      - "causal_inference"
    project_implications:
      - "Store developmental links as hypotheses with alternatives, moderators and protective factors."
      - "Reject reverse causal reconstruction of childhood from current symptoms."
    limitations:
      - "Brief conceptual paper, not a quantified personal-risk model."
      - "Does not identify which pathway applies to a particular person."
    rights_notes: "Cambridge University Press copyright applies; cite and link only unless reuse is licensed."
    superseded: false
    review_due: "2031-08-10"

  - id: "CLIN-018"
    title: "Narrative Identity"
    authors_or_organization: "McAdams D. P.; McLean K. C."
    type: "peer-reviewed research review"
    publication: "Current Directions in Psychological Science 22(3):233-238"
    publication_date: "2013-06-01"
    url: "https://doi.org/10.1177/0963721413475622"
    accessed_at: "2026-08-10"
    evidence_tier: "T3_framework_or_consensus"
    domains:
      - "narrative_identity"
      - "autobiographical_meaning"
      - "development"
    project_implications:
      - "Store narrative interpretation as a dated, authored version separate from raw memories and event candidates."
      - "Permit multiple narratives and explicit revision rather than one canonical life story."
    limitations:
      - "Narrative coherence and meaning do not establish historical accuracy."
      - "Cultural and linguistic context shapes narrative form."
    rights_notes: "SAGE copyright applies; cite DOI and do not reproduce protected content without permission."
    superseded: false
    review_due: "2029-08-10"

  - id: "CLIN-019"
    title: "Early childhood attachment stability and change: a meta-analysis"
    authors_or_organization: "Opie J. E. et al."
    type: "meta-analysis"
    publication: "Attachment & Human Development 23(6):897-930"
    publication_date: "2020-08-10"
    url: "https://pubmed.ncbi.nlm.nih.gov/32772822/"
    accessed_at: "2026-08-10"
    evidence_tier: "T2_systematic_review_or_meta_analysis"
    domains:
      - "attachment"
      - "early_development"
      - "stability_and_change"
    project_implications:
      - "Model attachment-related observations as relationship-, context- and time-specific dimensions."
      - "Reject immutable attachment-style identity labels and deterministic caregiver blame."
    limitations:
      - "Stability estimates vary with method, interval and sample, with publication-bias concerns."
      - "Early-childhood attachment findings cannot be directly converted into adult diagnosis or individual causation."
    rights_notes: "Article is available through PubMed Central under its stated terms; verify the article licence before reuse of content."
    superseded: false
    review_due: "2028-08-10"

  - id: "CLIN-020"
    title: "VA/DoD Clinical Practice Guideline for Management of Posttraumatic Stress Disorder and Acute Stress Disorder"
    authors_or_organization: "US Department of Veterans Affairs; US Department of Defense"
    type: "evidence-graded clinical practice guideline"
    publication: "VA/DoD Clinical Practice Guideline, Version 4.0"
    publication_date: "2023-06-01"
    url: "https://healthquality.va.gov/HEALTHQUALITY/guidelines/MH/ptsd/"
    accessed_at: "2026-08-10"
    evidence_tier: "T1_official_classification_or_guideline"
    domains:
      - "PTSD"
      - "acute_stress"
      - "trauma_assessment"
      - "treatment_boundary"
    project_implications:
      - "Keep exposure, symptoms, course, impairment and diagnosis as separate records."
      - "Do not make PSYCHE OS an autonomous trauma-treatment or treatment-selection system."
    limitations:
      - "Adult VA/DoD population and service context limit generalization."
      - "The PDF was administratively edited in 2024; current version should be rechecked."
    rights_notes: "US government guideline; cite official source and verify reuse terms for contributed or third-party material."
    superseded: false
    review_due: "2027-08-10"

  - id: "CLIN-021"
    title: "Enhancing Conceptual Clarity regarding the Construct of Moral Injury"
    authors_or_organization: "Frankfurt O'Brien S.; Baptista I.; Szeszko P. R."
    type: "peer-reviewed conceptual review"
    publication: "Psychotherapy and Psychosomatics"
    publication_date: "2024-10-07"
    url: "https://pubmed.ncbi.nlm.nih.gov/39374594/"
    accessed_at: "2026-08-10"
    evidence_tier: "T3_framework_or_consensus"
    domains:
      - "moral_injury"
      - "trauma_related_formulation"
      - "construct_validity"
    project_implications:
      - "Represent moral injury only as an optional formulation involving event or appraisal, values, responsibility and consequences."
      - "Do not treat moral injury as a settled diagnosis or as proof that an event occurred."
    limitations:
      - "Construct boundaries and operational definitions remain contested."
      - "Clinical populations and measures are heterogeneous."
    rights_notes: "Publisher copyright applies; PubMed metadata may be cited and article content requires licence review."
    superseded: false
    review_due: "2027-08-10"

  - id: "CLIN-022"
    title: "Trajectories of resilience and dysfunction following potential trauma: A review and statistical evaluation"
    authors_or_organization: "Galatzer-Levy I. R.; Huang S. H.; Bonanno G. A."
    type: "systematic review and statistical synthesis"
    publication: "Clinical Psychology Review 63"
    publication_date: "2018-07-01"
    url: "https://pubmed.ncbi.nlm.nih.gov/29902711/"
    accessed_at: "2026-08-10"
    evidence_tier: "T2_systematic_review_or_meta_analysis"
    domains:
      - "resilience"
      - "trauma_trajectories"
      - "recovery"
    project_implications:
      - "Allow resilient, recovery, delayed and fluctuating courses rather than assuming chronic dysfunction."
      - "Record strengths and supportive conditions without making resilience a moral obligation."
    limitations:
      - "Trajectory estimates depend on sample, outcome, number of waves and modelling choices."
      - "A modal group-level trajectory cannot predict an individual's path."
    rights_notes: "Elsevier copyright applies; cite and link, and do not reuse protected content without permission."
    superseded: false
    review_due: "2028-08-10"

  - id: "CLIN-023"
    title: "Hypnotic suggestibility in dissociative and related disorders: A meta-analysis"
    authors_or_organization: "Wieder L.; Brown R. J.; Thompson T.; Terhune D. B."
    type: "meta-analysis"
    publication: "Neuroscience & Biobehavioral Reviews 139:104751"
    publication_date: "2022-06-26"
    url: "https://pubmed.ncbi.nlm.nih.gov/35760389/"
    accessed_at: "2026-08-10"
    evidence_tier: "T2_systematic_review_or_meta_analysis"
    domains:
      - "dissociation"
      - "suggestibility"
      - "hypnosis"
      - "memory_safety"
    project_implications:
      - "Prohibit hypnosis, regression, guided imagery and recovered-memory elicitation."
      - "Treat dissociative phenomena as heterogeneous reports and never as proof of trauma etiology."
    limitations:
      - "Heterogeneous diagnostic groups and methods, with evidence of publication bias."
      - "Group differences do not establish suggestibility or memory in an individual."
    rights_notes: "Elsevier copyright applies; cite PubMed or DOI and do not reproduce article content without permission."
    superseded: false
    review_due: "2028-08-10"

  - id: "CLIN-024"
    title: "What science tells us about false and repressed memories"
    authors_or_organization: "Otgaar H.; Howe M. L.; Patihis L."
    type: "peer-reviewed evidence review"
    publication: "Memory 30(1):16-21"
    publication_date: "2021-01-12"
    url: "https://pubmed.ncbi.nlm.nih.gov/33435830/"
    accessed_at: "2026-08-10"
    evidence_tier: "T3_framework_or_consensus"
    domains:
      - "false_memory"
