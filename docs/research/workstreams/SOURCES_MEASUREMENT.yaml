sources:
  - id: "MEAS-001"
    title: "Standards for Educational and Psychological Testing"
    authors_or_body: "American Educational Research Association; American Psychological Association; National Council on Measurement in Education"
    authors_or_organization: "American Educational Research Association; American Psychological Association; National Council on Measurement in Education"
    year: 2014
    type: "professional_standard"
    source_type: "professional_standard"
    publication: "AERA/APA/NCME"
    publication_date: "2014"
    url: "https://www.testingstandards.net/"
    accessed: "2026-08-10"
    accessed_at: "2026-08-10"
    evidence_tier: "official_standard_or_guideline"
    domains: ["psychometrics", "validity", "reliability", "fairness", "test_use"]
    currentness: "Current official edition confirmed on 2026-08-10; revision activity should be monitored."
    project_implication: "Treat validity as support for a score interpretation in a specified context, not as a permanent property of a test."
    project_implications:
      - "Require a documented construct, intended use, population, administration mode and interpretation before enabling an assessment."
      - "Separate screening from diagnosis and require evidence for each consequential use."
    limitations:
      - "Broad professional standard; it does not validate any particular PSYCHE OS instrument or Russian-language version."
    rights: "Copyrighted publication; do not reproduce the standards text beyond permitted quotation."
    rights_notes: "Use the principles and citation; obtain the publication under the publisher's terms for detailed implementation."
    superseded: false
    review_due: "2027-02-10"

  - id: "MEAS-002"
    title: "COSMIN guideline for systematic reviews of patient-reported outcome measures"
    authors_or_body: "Prinsen CAC et al.; COSMIN initiative"
    authors_or_organization: "Prinsen CAC et al.; COSMIN initiative"
    year: 2018
    type: "methodological_guideline"
    source_type: "methodological_guideline"
    publication: "Quality of Life Research 27:1147-1157"
    publication_date: "2018-05"
    url: "https://doi.org/10.1007/s11136-018-1798-3"
    accessed: "2026-08-10"
    accessed_at: "2026-08-10"
    evidence_tier: "methodological_consensus"
    domains: ["psychometrics", "PROM", "validity", "reliability", "measurement_error", "responsiveness"]
    currentness: "Peer-reviewed guideline remains foundational; the current COSMIN manual and website were checked on 2026-08-10."
    project_implication: "Represent every measurement property separately and use unknown when evidence is absent."
    project_implications:
      - "Prioritize content validity and context of use before numerical reliability summaries."
      - "Store evidence for structural validity, reliability, measurement error, cross-cultural validity and responsiveness independently."
    limitations:
      - "Designed for systematic reviews of PROMs and requires operational translation into product gates."
    rights: "Publisher copyright applies; methodological concepts may be summarized with attribution."
    rights_notes: "Do not bundle COSMIN manuals or scoring materials; link to the official source."
    superseded: false
    review_due: "2027-08-10"

  - id: "MEAS-003"
    title: "Patient-Focused Drug Development: Selecting, Developing, or Modifying Fit-for-Purpose Clinical Outcome Assessments"
    authors_or_body: "U.S. Food and Drug Administration"
    authors_or_organization: "U.S. Food and Drug Administration"
    year: 2025
    type: "regulatory_guidance"
    source_type: "regulatory_guidance"
    publication: "FDA Guidance for Industry, Food and Drug Administration Staff, and Other Stakeholders"
    publication_date: "2025-10"
    url: "https://www.fda.gov/regulatory-information/search-fda-guidance-documents/patient-focused-drug-development-selecting-developing-or-modifying-fit-purpose-clinical-outcome"
    accessed: "2026-08-10"
    accessed_at: "2026-08-10"
    evidence_tier: "official_standard_or_guideline"
    domains: ["clinical_outcome_assessment", "fit_for_purpose", "content_validity", "regulation"]
    currentness: "Final guidance current as checked on 2026-08-10."
    project_implication: "Bind each clinical outcome assessment to a concept of interest, context of use and evidence package."
    project_implications:
      - "A familiar scale name is insufficient; intended interpretation and decision must be explicit."
      - "Modification, electronic migration or translation requires documented evaluation."
    limitations:
      - "Regulatory context is medical product development in the United States; PSYCHE OS is not assumed to be a regulated trial instrument."
    rights: "U.S. government guidance is publicly accessible; third-party material may retain separate rights."
    rights_notes: "Cite the official page and avoid implying FDA endorsement of PSYCHE OS."
    superseded: false
    review_due: "2027-02-10"

  - id: "MEAS-004"
    title: "ITC Guidelines for Translating and Adapting Tests, Second Edition"
    authors_or_body: "International Test Commission"
    authors_or_organization: "International Test Commission"
    year: 2017
    type: "professional_guideline"
    source_type: "professional_guideline"
    publication: "International Test Commission"
    publication_date: "2017"
    url: "https://www.intestcom.org/files/guideline_test_adaptation_2ed.pdf"
    accessed: "2026-08-10"
    accessed_at: "2026-08-10"
    evidence_tier: "official_standard_or_guideline"
    domains: ["translation", "test_adaptation", "cross_cultural_validity", "measurement_invariance", "licensing"]
    currentness: "Second edition remained the official ITC adaptation guideline at the 2026-08-10 check."
    project_implication: "An LLM or literal translation cannot inherit psychometric properties, norms or cutoffs."
    project_implications:
      - "Require permission, cultural adaptation, pilot testing and empirical equivalence for every Russian-language assessment."
      - "Label nonvalidated translations as plain user content and disable standardized scoring."
    limitations:
      - "Provides process principles rather than validation evidence for any named Russian-language instrument."
    rights: "Copyright International Test Commission; reproduction and adaptation require compliance with ITC terms."
    rights_notes: "Link rather than redistribute; obtain test-owner permission separately."
    superseded: false
    review_due: "2027-08-10"

  - id: "MEAS-005"
    title: "Principles of Good Practice for the Translation and Cultural Adaptation Process for Patient-Reported Outcomes Measures"
    authors_or_body: "Wild D et al.; ISPOR Task Force for Translation and Cultural Adaptation"
    authors_or_organization: "Wild D et al.; ISPOR Task Force for Translation and Cultural Adaptation"
    year: 2005
    type: "task_force_report"
    source_type: "task_force_report"
    publication: "Value in Health 8(2):94-104"
    publication_date: "2005-03"
    url: "https://pubmed.ncbi.nlm.nih.gov/15804318/"
    accessed: "2026-08-10"
    accessed_at: "2026-08-10"
    evidence_tier: "methodological_consensus"
    domains: ["translation", "cultural_adaptation", "PROM", "quality_assurance"]
    currentness: "Foundational process guidance; checked against newer ITC and FDA context on 2026-08-10."
    project_implication: "Use a documented multi-step adaptation process rather than one-pass translation."
    project_implications:
      - "Store translation provenance, reconciliation, cognitive debriefing and version history."
      - "Do not equate linguistic fluency with measurement equivalence."
    limitations:
      - "Consensus process is older and does not itself establish measurement invariance or responsiveness."
    rights: "Journal copyright; abstract and bibliographic record are publicly accessible."
    rights_notes: "Do not reproduce proprietary questionnaire content."
    superseded: false
    review_due: "2028-08-10"

