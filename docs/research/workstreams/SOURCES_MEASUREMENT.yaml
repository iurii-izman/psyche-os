  - id: "MEAS-009"
    title: "Measurement Invariance Conventions and Reporting: The State of the Art and Future Directions for Psychological Research"
    authors_or_body: "Putnick DL, Bornstein MH"
    authors_or_organization: "Putnick DL, Bornstein MH"
    year: 2016
    type: "methodological_review"
    source_type: "methodological_review"
    publication: "Developmental Review 41:71-90"
    publication_date: "2016-09"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC5145197/"
    accessed: "2026-08-10"
    accessed_at: "2026-08-10"
    evidence_tier: "foundational_methodology"
    domains: ["measurement_invariance", "longitudinal_measurement", "group_comparison", "DIF"]
    currentness: "Foundational reporting synthesis; current model-specific practice should be reviewed per instrument."
    project_implication: "Block group or time comparisons when measurement equivalence is unsupported."
    project_implications:
      - "Store configural, metric, scalar and residual invariance evidence separately."
      - "Treat partial invariance as an explicit analytic decision with sensitivity checks."
    limitations:
      - "Conventions are not universal pass/fail laws and depend on model, sample size and substantive context."
    rights: "Open-access manuscript with publisher terms."
    rights_notes: "Use summarized methodology with attribution."
    superseded: false
    review_due: "2028-08-10"

  - id: "MEAS-010"
    title: "Retest effects in working memory capacity tests: A meta-analysis"
    authors_or_body: "Scharfen J, Jansen K, Holling H"
    authors_or_organization: "Scharfen J, Jansen K, Holling H"
    year: 2018
    type: "meta_analysis"
    source_type: "meta_analysis"
    publication: "Psychonomic Bulletin & Review 25(6):2175-2199"
    publication_date: "2018-12"
    url: "https://pubmed.ncbi.nlm.nih.gov/29907925/"
    accessed: "2026-08-10"
    accessed_at: "2026-08-10"
    evidence_tier: "systematic_review_or_meta_analysis"
    domains: ["retest_effect", "practice_effect", "cognitive_measurement", "longitudinal_change"]
    currentness: "Relevant meta-analysis checked on 2026-08-10."
    project_implication: "Repeated cognitive scores require practice-effect flags and cannot be interpreted as pure change."
    project_implications:
      - "Record administration count, interval and alternate form."
      - "Do not apply the reported pooled effect as a universal correction for unrelated tests."
    limitations:
