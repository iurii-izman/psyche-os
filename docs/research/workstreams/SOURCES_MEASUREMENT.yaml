  - id: "MEAS-018"
    title: "Performance of consumer wrist-worn sleep tracking devices compared to polysomnography: a meta-analysis"
    authors_or_body: "Lee YJ, Lee JY, Cho JH, Kang YJ, Choi JH"
    authors_or_organization: "Lee YJ, Lee JY, Cho JH, Kang YJ, Choi JH"
    year: 2025
    type: "meta_analysis"
    source_type: "meta_analysis"
    publication: "Journal of Clinical Sleep Medicine 21(3):573-582"
    publication_date: "2025-03-01"
    url: "https://pubmed.ncbi.nlm.nih.gov/39484805/"
    accessed: "2026-08-10"
    accessed_at: "2026-08-10"
    evidence_tier: "systematic_review_or_meta_analysis"
    domains: ["consumer_wearables", "polysomnography", "sleep_validity", "meta_analysis"]
    currentness: "Search covered evidence through March 2024; article remained a recent meta-analysis at the 2026-08-10 check."
    project_implication: "Do not treat wrist-worn consumer estimates as PSG-equivalent or diagnostically valid."
    project_implications:
      - "Use only stable-version general trends with device-specific uncertainty."
      - "Preserve model and algorithm epoch because results are heterogeneous across devices and populations."
