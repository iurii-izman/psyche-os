    publication_date: "2010-11"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC2965562/"
    accessed: "2026-08-10"
    accessed_at: "2026-08-10"
    evidence_tier: "strong_primary_evidence"
    domains: ["PROMIS", "IRT", "item_banks", "CAT", "calibration"]
    currentness: "Foundational PROMIS calibration paper; current administration and permissions must be checked separately."
    project_implication: "CAT requires calibrated item banks and population-linked score interpretation, not LLM item generation."
    project_implications:
      - "Version item banks, parameters and score transforms."
      - "Keep general-population anchoring distinct from individual clinical interpretation."
    limitations:
