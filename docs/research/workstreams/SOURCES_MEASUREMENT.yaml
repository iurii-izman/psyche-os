  - id: "MEAS-008"
    title: "Overview of Classical Test Theory and Item Response Theory for the Quantitative Assessment of Items in Developing Patient-Reported Outcome Measures"
    authors_or_body: "Cappelleri JC, Lundy JJ, Hays RD"
    authors_or_organization: "Cappelleri JC, Lundy JJ, Hays RD"
    year: 2014
    type: "methodological_review"
    source_type: "methodological_review"
    publication: "Clinical Therapeutics 36(5):648-662"
    publication_date: "2014-05"
    url: "https://pmc.ncbi.nlm.nih.gov/articles/PMC4096146/"
    accessed: "2026-08-10"
    accessed_at: "2026-08-10"
    evidence_tier: "foundational_methodology"
    domains: ["CTT", "IRT", "item_analysis", "PROM"]
    currentness: "Foundational comparison; checked for continued methodological relevance on 2026-08-10."
    project_implication: "Choose CTT or IRT assumptions deliberately and report sample/model dependence."
    project_implications:
      - "Do not treat alpha as sufficient evidence of validity or reliability."
      - "Require dimensionality, fit and DIF checks before IRT/CAT use."
    limitations:
