- id: ARCH-022
  title: RFC 9106 — Argon2 Memory-Hard Function for Password Hashing and Proof-of-Work
  authors_or_organization: Internet Engineering Task Force
  type: internet_standard
  publication: Internet Engineering Task Force
  publication_date: '2021'
  url: https://www.rfc-editor.org/info/rfc9106
  accessed_at: '2026-08-10'
  evidence_tier: T1_normative_standard
  domains:
  - cryptography
  - password_kdf
  - recovery
  currentness: Current informational RFC for Argon2 parameter guidance.
  project_implications:
  - Use Argon2id with per-vault salt and benchmarked versioned parameters for recovery-secret wrapping.
  limitations:
  - Parameters must be benchmarked and periodically reviewed; not a full key-management design.
  rights_notes: Citation and link only; RFC terms apply.
  superseded: false
  review_due: '2027-08-10'
