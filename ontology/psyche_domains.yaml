schema_version: "1.0.0"

registry:
  id: "psyche_domains"
  version: "2.0.0"
  status: "research_converged_candidate"
  published_at: "2026-08-10"
  knowledge_cutoff: "2026-08-10"
  default_language: "ru"
  authority_document: "docs/SCIENTIFIC_GOVERNANCE.md"
  description: >-
    Версионируемый навигационный реестр доменов PSYCHE OS. Он разделяет источники,
    сообщения, феноменологию, functioning, классификационные ссылки,
    исследовательские измерения, traits, контекст и производные утверждения.
  completeness_claim: false
  completeness_notice_ru: >-
    Реестр не является полной, окончательной или универсальной картой психики,
    личности, здоровья либо идентичности человека. Отсутствие домена не означает
    отсутствие явления; наличие домена не доказывает его существование у человека.
  completeness_notice_en: >-
    This registry is not a complete, final, or universal map of mind, personality,
    health, or identity. An absent domain does not mean an absent phenomenon, and a
    listed domain does not establish that the phenomenon exists in a person.
  change_policy:
    stable_ids_are_never_reused: true
    semantic_change_requires_version_bump: true
    old_records_remain_version_pinned: true
    lossy_mappings_must_be_explicit: true
    unknown_is_permitted: true
    real_data_gate: "CLOSED"

schema_contract:
  domain_id_pattern: "^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)+$"
  required_domain_fields:
    - "id"
    - "layer"
    - "labels"
    - "definition"
    - "non_goals"
    - "allowed_evidence_kinds"
    - "allowed_claim_types"
    - "inference_limits"
    - "sensitivity"
    - "review"
  labels_required: ["ru", "en"]
  source_id_pattern: "^(CLIN|MEAS|ARCH)-[0-9]{3}$"
  reference_semantics:
    evidence: "An allowed evidence kind can support or contradict a claim; it never guarantees truth."
    claim: "An allowed claim type is the maximum syntactic class, subject to evidence, rights, review, and causality gates."
    source_ids: "Scientific sources informing the domain boundary; not evidence about an individual."

enums:
  layer_id:
    - "source_evidence"
    - "report_memory"
    - "phenomenology"
    - "functioning_icf"
    - "classification_reference"
    - "research_dimension"
    - "trait_personality"
    - "development_context"
    - "values_meaning"
    - "strengths_thriving"
    - "cognition"
    - "sleep_physical"
    - "relationship_social"
    - "work_learning"
    - "environment_context"
    - "assessment_measurement"
    - "intervention_experiment"
    - "safety"
  evidence_kind:
    - "source_artifact"
    - "verbatim_report"
    - "memory_report"
    - "current_self_report"
    - "collateral_report"
    - "contemporaneous_record"
    - "self_observation"
    - "collateral_observation"
    - "clinician_observation"
    - "device_observation"
    - "deterministic_measurement"
    - "assessment_score"
    - "documented_classification"
    - "external_knowledge_source"
    - "protocol_record"
    - "intervention_observation"
    - "derived_statistic"
  claim_type:
    - "descriptive"
    - "pattern"
    - "interpretive"
    - "narrative"
    - "statistical_association"
    - "causal_hypothesis"
    - "prediction"
    - "clinical_mapping"
    - "trait_estimate"
    - "functioning_assessment"
    - "strength_or_resource"
    - "recommendation_candidate"
  causality_level:
    - "C0_observation"
    - "C1_cooccurrence"
    - "C2_temporal_precedence"
    - "C3_replicated_within_person_association"
    - "C4_quasi_experimental"
    - "C5_randomized_single_case"
    - "C6_replicated_n_of_1_or_trial"
  sensitivity_level:
    - "sensitive"
    - "highly_sensitive"
    - "critical_safety"
  review_status:
    - "accepted_with_limits"
    - "provisional"
    - "research_only"
    - "deprecated"
    - "withdrawn"
  mapping_relation:
    - "exact"
    - "narrower"
    - "broader"
    - "related"
    - "overlaps"
    - "no_safe_mapping"
  domain_relation:
    - "contextualizes"
    - "may_support"
    - "may_contradict"
    - "maps_to"
    - "is_distinct_from"
    - "requires_review_with"

evidence_kind_contracts:
  - id: "source_artifact"
    boundary: "Подлинность или целостность артефакта не доказывает истинность утверждений внутри."
  - id: "verbatim_report"
    boundary: "Доказывает только содержание сообщения в зафиксированном контексте."
  - id: "memory_report"
    boundary: "Текущая recollection; vividness и confidence не доказывают историческую точность."
  - id: "current_self_report"
    boundary: "Перспектива человека в заданном окне; не независимое подтверждение и не диагноз."
  - id: "collateral_report"
    boundary: "Сообщение третьего лица с отдельной perspective, consent и возможным bias."
  - id: "contemporaneous_record"
    boundary: "Документирует запись, сделанную близко ко времени события; содержание может быть ошибочным."
  - id: "self_observation"
    boundary: "Наблюдение отделено от объяснения и содержит контекст/время."
  - id: "collateral_observation"
    boundary: "Внешнее наблюдение не получает приоритет только из-за внешнего автора."
  - id: "clinician_observation"
    boundary: "Используется с credential, scope, encounter time и исходным документом."
  - id: "device_observation"
    boundary: "Нужны device/firmware/algorithm version; consumer estimate не является ground truth."
  - id: "deterministic_measurement"
    boundary: "Результат воспроизводимого правила; валидность правила оценивается отдельно."
  - id: "assessment_score"
    boundary: "Только approved definition/version/language/scoring; screening не является diagnosis."
  - id: "documented_classification"
    boundary: "Хранит system/version/author/status; не подтверждает актуальность или этиологию."
  - id: "external_knowledge_source"
    boundary: "Информирует schema/interpretation, но не является evidence о конкретном человеке."
  - id: "protocol_record"
    boundary: "Показывает pre-specified plan, но не исполнение или эффект."
  - id: "intervention_observation"
    boundary: "Наблюдение во время действия; attribution зависит от design и confounding."
  - id: "derived_statistic"
    boundary: "Всегда привязан к inputs, estimand, algorithm и uncertainty; не становится raw evidence."

layer_contracts:
  - id: "source_evidence"
    purpose: "Сохранить происхождение, целостность, locator, права и raw/verbatim material."
    may_emit: ["descriptive"]
    forbidden_inference: "Source authenticity to truth of content."
  - id: "report_memory"
    purpose: "Сохранить, кто что сообщил, когда, с какой перспективой и temporal uncertainty."
    may_emit: ["descriptive", "narrative"]
    forbidden_inference: "Report or memory to historical fact."
  - id: "phenomenology"
    purpose: "Описать форму, содержание, course, context, distress и uncertainty переживания."
    may_emit: ["descriptive", "pattern", "interpretive"]
    forbidden_inference: "Phenomenon to diagnosis or etiology."
  - id: "functioning_icf"
    purpose: "Описать activities, participation, barriers, facilitators и support needs."
    may_emit: ["descriptive", "functioning_assessment", "pattern"]
    forbidden_inference: "Impairment to a specific disorder or good functioning to absence of symptoms."
  - id: "classification_reference"
    purpose: "Хранить versioned ICD/DSM references и actor-qualified mappings."
    may_emit: ["clinical_mapping"]
    forbidden_inference: "Self-report or screening to autonomous diagnosis; classification to identity."
  - id: "research_dimension"
    purpose: "Хранить versioned research-framework mappings."
    may_emit: ["descriptive", "pattern"]
    forbidden_inference: "Research dimension to clinical diagnosis, mechanism, or treatment selection."
  - id: "trait_personality"
    purpose: "Хранить instrument-native trait estimates отдельно от states."
    may_emit: ["trait_estimate", "pattern"]
    forbidden_inference: "Single episode or text trace to stable trait."
  - id: "development_context"
    purpose: "Представить lifespan context, multiple pathways, narratives и uncertainty."
    may_emit: ["descriptive", "narrative", "causal_hypothesis"]
    forbidden_inference: "Adult outcome to deterministic reconstructed childhood cause."
  - id: "values_meaning"
    purpose: "Хранить stated values, goals, meaning and preference as person-owned representations."
    may_emit: ["descriptive", "narrative", "strength_or_resource"]
    forbidden_inference: "Current value statement to immutable essence or moral ranking."
  - id: "strengths_thriving"
    purpose: "Хранить resources, positive functioning and supportive conditions."
    may_emit: ["strength_or_resource", "descriptive", "pattern"]
    forbidden_inference: "Strength or wellbeing to absence of distress or disorder."
  - id: "cognition"
    purpose: "Разделять report, task performance, function and context."
    may_emit: ["descriptive", "pattern", "functioning_assessment"]
    forbidden_inference: "One task, rating, or score to a global cognitive identity."
  - id: "sleep_physical"
    purpose: "Хранить субъективные, device-derived и clinical physical/sleep contexts раздельно."
    may_emit: ["descriptive", "pattern", "statistical_association"]
    forbidden_inference: "Consumer device output to diagnosis or objective ground truth."
  - id: "relationship_social"
    purpose: "Описать relationship-specific context, reciprocity, safety, conflict and repair."
    may_emit: ["descriptive", "pattern", "narrative"]
    forbidden_inference: "Pattern to diagnosis of another person or immutable attachment identity."
  - id: "work_learning"
    purpose: "Описать role demands, participation, barriers, skills and learning context."
    may_emit: ["descriptive", "functioning_assessment", "strength_or_resource"]
    forbidden_inference: "Performance outcome to global worth, intelligence, or diagnosis."
  - id: "environment_context"
    purpose: "Хранить physical, social, cultural, economic and digital context."
    may_emit: ["descriptive", "pattern", "statistical_association"]
    forbidden_inference: "Contextual association to personal defect or deterministic cause."
  - id: "assessment_measurement"
    purpose: "Версионировать instrument rights, administration and deterministic scoring."
    may_emit: ["descriptive", "trait_estimate", "functioning_assessment", "pattern"]
    forbidden_inference: "Score or cutoff to diagnosis, certainty, or licensed use beyond context."
  - id: "intervention_experiment"
    purpose: "Хранить evidence allowlist, protocols, risk, observations and bounded effects."
    may_emit: ["recommendation_candidate", "statistical_association", "causal_hypothesis"]
    forbidden_inference: "Before-after change to effect; model proposal to treatment."
  - id: "safety"
    purpose: "Хранить user-stated or qualified safety information and human escalation state."
    may_emit: ["descriptive"]
    forbidden_inference: "Automated low-risk verdict, diagnosis, or replacement of emergency assessment."

prohibited_cross_layer_inferences:
  - id: "PCLI-001"
    from: "report_memory"
    to: "source_evidence"
    rule: "Memory/report must not be relabeled as independently verified fact."
  - id: "PCLI-002"
    from: "assessment_measurement"
    to: "classification_reference"
    rule: "Screening result must not create a diagnosis."
  - id: "PCLI-003"
    from: "phenomenology"
    to: "classification_reference"
    rule: "Phenomenon alone must not create an autonomous diagnosis."
  - id: "PCLI-004"
    from: "research_dimension"
    to: "classification_reference"
    rule: "RDoC/HiTOP mapping must not be presented as clinical diagnosis."
  - id: "PCLI-005"
    from: "trait_personality"
    to: "development_context"
    rule: "Trait estimate must not reconstruct a developmental cause."
  - id: "PCLI-006"
    from: "sleep_physical"
    to: "classification_reference"
    rule: "Wearable/device estimate must not create a sleep or mental-health diagnosis."
  - id: "PCLI-007"
    from: "intervention_experiment"
    to: "intervention_experiment"
    rule: "Association or before-after change must not be labeled an effect beyond causality gate."
  - id: "PCLI-008"
    from: "strengths_thriving"
    to: "phenomenology"
    rule: "Positive functioning must not erase distress or phenomena."
  - id: "PCLI-009"
    from: "functioning_icf"
    to: "classification_reference"
    rule: "Functional difficulty must not imply a specific disorder."
  - id: "PCLI-010"
    from: "source_evidence"
    to: "safety"
    rule: "Imported content or an AI proposal must not lower a safety state or alter policy."

relation_types:
  - id: "contextualizes"
    directionality: "directed"
    meaning: "Source domain provides relevant context but does not explain or cause the target."
  - id: "may_support"
    directionality: "directed"
    meaning: "Evidence in the source domain may support a target claim through an explicit EvidenceLink."
  - id: "may_contradict"
    directionality: "directed"
    meaning: "Evidence in the source domain may contradict a target claim without deleting it."
  - id: "maps_to"
    directionality: "directed"
    meaning: "Versioned, sourced and potentially lossy mapping; mapping_relation is required."
  - id: "is_distinct_from"
    directionality: "symmetric"
    meaning: "The domains must not be collapsed even when they co-occur."
  - id: "requires_review_with"
    directionality: "symmetric"
    meaning: "Consequential use in either domain requires joint domain review."

domains:
  - id: "source.evidence_provenance"
    layer: "source_evidence"
    labels: {ru: "Источники и происхождение", en: "Sources and provenance"}
    definition: "Артефакты, locators, actors, timestamps, integrity, rights and derivation lineage."
    non_goals:
      - "Не устанавливает истинность содержания артефакта."
      - "Не превращает количество источников в confidence score."
    allowed_evidence_kinds: ["source_artifact", "contemporaneous_record", "external_knowledge_source"]
    allowed_claim_types: ["descriptive"]
    inference_limits: {maximum_causality_level: "C0_observation", requires_source_locator: true}
    sensitivity:
      default: "sensitive"
      escalate_when: ["filename_or_metadata_reveals_health", "third_party_identity", "legal_or_sexual_context"]
    review:
      status: "accepted_with_limits"
      reviewed_at: "2026-08-10"
      review_due: "2027-08-10"
      source_ids: ["ARCH-041", "ARCH-042", "ARCH-043", "ARCH-044"]

  - id: "report.current_experience"
    layer: "report_memory"
    labels: {ru: "Сообщение о текущем опыте", en: "Current experience report"}
    definition: "Verbatim or structured first-person report about a current state, belief, preference, symptom or context."
    non_goals: ["Не является независимым наблюдением.", "Не является диагнозом или полной характеристикой человека."]
    allowed_evidence_kinds: ["verbatim_report", "current_self_report", "self_observation"]
    allowed_claim_types: ["descriptive", "narrative"]
    inference_limits: {maximum_causality_level: "C0_observation", preserve_verbatim: true}
    sensitivity:
      default: "highly_sensitive"
      escalate_when: ["acute_risk", "third_party_sensitive_content"]
    review:
      status: "accepted_with_limits"
      reviewed_at: "2026-08-10"
      review_due: "2027-08-10"
      source_ids: ["CLIN-001", "CLIN-045", "ARCH-041"]

  - id: "report.autobiographical_memory"
    layer: "report_memory"
    labels: {ru: "Автобиографическое воспоминание", en: "Autobiographical memory report"}
    definition: "Current recollection with source attribution, temporal precision, vividness, belief, corroboration and conflict represented separately."
    non_goals: ["Не объявляет recollection историческим фактом.", "Не восстанавливает скрытую или вытесненную память."]
    allowed_evidence_kinds: ["memory_report", "verbatim_report", "contemporaneous_record", "collateral_report"]
    allowed_claim_types: ["descriptive", "narrative", "interpretive"]
    inference_limits: {maximum_causality_level: "C0_observation", corroboration_required_for_historical_claim: true}
    sensitivity:
      default: "highly_sensitive"
      escalate_when: ["trauma_or_abuse", "third_party_allegation", "legal_context"]
    review:
      status: "accepted_with_limits"
      reviewed_at: "2026-08-10"
      review_due: "2027-02-10"
      source_ids: ["CLIN-024", "CLIN-025", "CLIN-026", "CLIN-027"]

  - id: "report.third_party_collateral"
    layer: "report_memory"
    labels: {ru: "Сообщение третьего лица", en: "Third-party collateral report"}
    definition: "Attributed report or document about another person, kept distinct by perspective, consent, provenance and scope."
    non_goals: ["Не диагностирует третье лицо.", "Не предполагает consent на облачную обработку или экспорт."]
    allowed_evidence_kinds: ["collateral_report", "collateral_observation", "contemporaneous_record", "source_artifact"]
    allowed_claim_types: ["descriptive", "narrative"]
    inference_limits: {maximum_causality_level: "C0_observation", third_party_policy_required: true}
    sensitivity:
      default: "highly_sensitive"
      escalate_when: ["minor_or_dependent", "health_or_legal_data", "safeguarding"]
    review:
      status: "accepted_with_limits"
      reviewed_at: "2026-08-10"
      review_due: "2027-02-10"
      source_ids: ["CLIN-025", "CLIN-026", "ARCH-004", "ARCH-005"]

  - id: "clinical.phenomenology_general"
    layer: "phenomenology"
    labels: {ru: "Общая клиническая феноменология", en: "General clinical phenomenology"}
    definition: "Form, content, onset, course, context, distress, conviction, insight/uncertainty and functional impact recorded as separable fields."
    non_goals: ["Не является этиологической теорией.", "Не заменяет differential clinical assessment."]
    allowed_evidence_kinds: ["verbatim_report", "current_self_report", "self_observation", "collateral_observation", "clinician_observation"]
    allowed_claim_types: ["descriptive", "pattern", "interpretive"]
    inference_limits: {maximum_causality_level: "C2_temporal_precedence", clinical_mapping_requires_qualified_actor: true}
    sensitivity:
      default: "highly_sensitive"
      escalate_when: ["acute_risk", "psychosis_or_mania", "third_party_harm"]
    review:
      status: "accepted_with_limits"
      reviewed_at: "2026-08-10"
      review_due: "2027-02-10"
      source_ids: ["CLIN-001", "CLIN-002", "CLIN-045"]

  - id: "clinical.mood_affect"
    layer: "phenomenology"
    labels: {ru: "Настроение и аффективный опыт", en: "Mood and affective experience"}
    definition: "Reported or observed mood/affect phenomena with duration, variability, context, impairment and competing explanations."
    non_goals: ["Не ставит mood disorder по языку или одному score.", "Не выводит причину колебаний без design evidence."]
    allowed_evidence_kinds: ["current_self_report", "self_observation", "collateral_observation", "clinician_observation", "assessment_score"]
    allowed_claim_types: ["descriptive", "pattern", "statistical_association", "clinical_mapping"]
    inference_limits: {maximum_causality_level: "C3_replicated_within_person_association", screening_to_diagnosis: false}
    sensitivity:
      default: "highly_sensitive"
      escalate_when: ["suicidality", "mania_or_psychosis", "severe_impairment"]
    review:
      status: "accepted_with_limits"
      reviewed_at: "2026-08-10"
      review_due: "2027-02-10"
      source_ids: ["CLIN-002", "CLIN-034", "CLIN-036", "MEAS-048"]

  - id: "clinical.anxiety_fear_avoidance"
    layer: "phenomenology"
    labels: {ru: "Тревога, страх и избегание", en: "Anxiety, fear, and avoidance"}
    definition: "Phenomena of threat anticipation, fear, bodily arousal, avoidance and safety behavior in a specified context and time."
    non_goals: ["Не превращает нормальный страх в disorder.", "Не рекомендует exposure автономно."]
    allowed_evidence_kinds: ["current_self_report", "self_observation", "clinician_observation", "assessment_score"]
    allowed_claim_types: ["descriptive", "pattern", "statistical_association", "clinical_mapping"]
    inference_limits: {maximum_causality_level: "C3_replicated_within_person_association", exposure_action_minimum_risk_tier: "R2_moderate_or_symptom_targeting"}
    sensitivity:
      default: "highly_sensitive"
      escalate_when: ["panic_with_medical_uncertainty", "severe_avoidance", "acute_risk"]
    review:
      status: "accepted_with_limits"
      reviewed_at: "2026-08-10"
      review_due: "2027-02-10"
      source_ids: ["CLIN-002", "CLIN-034", "CLIN-045"]

  - id: "clinical.trauma_stress_grief"
    layer: "phenomenology"
    labels: {ru: "Травматический стресс и горе", en: "Traumatic stress and grief"}
    definition: "Exposure report, response phenomena, course, impairment, grief/cultural context and classification references kept in separate records."
    non_goals: ["Adversity не равна PTSD.", "Интенсивное горе не патологизируется автоматически."]
    allowed_evidence_kinds: ["verbatim_report", "memory_report", "current_self_report", "contemporaneous_record", "clinician_observation", "documented_classification"]
    allowed_claim_types: ["descriptive", "pattern", "interpretive", "clinical_mapping"]
    inference_limits: {maximum_causality_level: "C2_temporal_precedence", recovered_memory_inference: false}
    sensitivity:
      default: "highly_sensitive"
      escalate_when: ["abuse_or_violence", "acute_risk", "minor_or_third_party_allegation"]
    review:
      status: "accepted_with_limits"
      reviewed_at: "2026-08-10"
      review_due: "2027-02-10"
      source_ids: ["CLIN-002", "CLIN-020", "CLIN-022", "CLIN-024", "CLIN-027"]

  - id: "clinical.dissociation"
    layer: "phenomenology"
    labels: {ru: "Диссоциативные явления", en: "Dissociative phenomena"}
    definition: "Depersonalization, derealization, amnesia-like reports and identity-related phenomena recorded without suggestive reconstruction."
    non_goals: ["Не подтверждает травматическую причину.", "Не использует suggestive memory-recovery workflow."]
    allowed_evidence_kinds: ["verbatim_report", "memory_report", "current_self_report", "clinician_observation", "documented_classification"]
    allowed_claim_types: ["descriptive", "pattern", "clinical_mapping"]
    inference_limits: {maximum_causality_level: "C1_cooccurrence", anti_suggestion_required: true}
    sensitivity:
      default: "highly_sensitive"
      escalate_when: ["identity_confusion_with_risk", "trauma_allegation", "acute_impairment"]
    review:
      status: "accepted_with_limits"
      reviewed_at: "2026-08-10"
      review_due: "2027-02-10"
      source_ids: ["CLIN-002", "CLIN-023", "CLIN-024", "CLIN-025"]

  - id: "clinical.psychosis_like_experience"
    layer: "phenomenology"
    labels: {ru: "Психозоподобный опыт", en: "Psychosis-like experience"}
    definition: "Unusual perceptions, beliefs or thought experiences represented by form, content, conviction, insight, context and safety impact."
    non_goals: ["Не подтверждает и не развивает delusional content.", "Не выдаёт automated psychosis diagnosis или low-risk verdict."]
    allowed_evidence_kinds: ["verbatim_report", "current_self_report", "collateral_observation", "clinician_observation", "documented_classification"]
    allowed_claim_types: ["descriptive", "clinical_mapping"]
    inference_limits: {maximum_causality_level: "C0_observation", human_safety_review_for_consequential_use: true}
