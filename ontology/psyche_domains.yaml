  - {from: "research.rdoc_dimensions", relation: "is_distinct_from", to: "classification.icd_reference", rationale: "Research constructs do not become diagnoses."}
  - {from: "research.hitop_dimensions", relation: "is_distinct_from", to: "classification.dsm_reference", rationale: "Dimensional covariance models do not become diagnostic verdicts."}
