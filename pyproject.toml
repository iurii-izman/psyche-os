[project]
name = "psyche-os"
version = "0.1.0"
description = "PSYCHE OS — Personal Evidence & Reflection System. F0: Minimal Irreversible Secure Core."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Iurii Izman" },
]
keywords = ["evidence", "privacy", "encryption", "personal", "reflection"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "cryptography>=46.0",
    "argon2-cffi>=25.0",
    "jsonschema>=4.25",
    "sqlcipher3>=0.6",
]

[project.scripts]
psyche-os = "psyche_os.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "ruff>=0.11",
    "mypy>=1.15",
    "coverage>=7.6",
    "hypothesis>=6.130",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W",        # pyflakes/pep8
    "I",                   # isort
    "N",                   # pep8-naming
    "UP",                  # pyupgrade
    "B",                   # flake8-bugbear
    "C4",                  # flake8-comprehensions
    "SIM",                 # flake8-simplify
    "RUF",                 # ruff-specific
]
ignore = [
    "E501",                # line too long — handled by formatter
    "B008",                # do not perform function calls in argument defaults — domain use cases
]

[tool.ruff.lint.isort]
known-first-party = ["psyche_os"]
force-sort-within-sections = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true
exclude = [
    "tests/fixtures/",
    ".venv/",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--tb=short",
]
markers = [
    "unit: unit tests (fast, no I/O beyond tempdir)",
    "property: property-based tests (hypothesis or similar)",
    "integration: integration tests (real temp directories, SQLCipher)",
    "security: security tests (crypto, plaintext scans, wrong keys)",
    "faults: fault injection tests (crash recovery, corruption)",
    "contracts: contract tests (CLI JSON stability, error schemas)",
    "slow: slow tests (E2E, semantic round trip)",
    "e2e: end-to-end synthetic lifecycle test",
    "sqlcipher: tests requiring SQLCipher profile",
    "os_wrap: tests requiring OS key wrapping",
    "recovery: tests requiring recovery wrapping",
]
timeout = 300

[tool.coverage.run]
source = ["src/psyche_os"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "pragma: no cover",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "psutil==7.2.2",
    "pyinstaller==6.22.0",
    "pywinauto==0.6.9",
    "pyyaml>=6.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/psyche_os"]
